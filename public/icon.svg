<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Watermelon Half 1 (Top Left) -->
  <g transform="translate(230, 230) rotate(-24) translate(-230, -230)" filter="url(#shadow)">
    <!-- Rind -->
    <path d="M 120 280 A 150 150 0 0 1 370 170 L 120 280 Z" fill="#15803d"/>
    <path d="M 130 274 A 140 140 0 0 1 360 175 L 130 274 Z" fill="#bbf7d0"/>
    <!-- Red Pulp -->
    <path d="M 140 268 A 128 128 0 0 1 350 182 L 140 268 Z" fill="#ef4444"/>
    <!-- Seeds -->
    <ellipse cx="200" cy="225" rx="5" ry="9" transform="rotate(30 200 225)" fill="#18181b"/>
    <ellipse cx="250" cy="210" rx="5" ry="9" transform="rotate(45 250 210)" fill="#18181b"/>
    <ellipse cx="295" cy="205" rx="5" ry="9" transform="rotate(60 295 205)" fill="#18181b"/>
  </g>

  <!-- Watermelon Half 2 (Bottom Right) -->
  <g transform="translate(290, 290) rotate(18) translate(-290, -290)" filter="url(#shadow)">
    <!-- Rind -->
    <path d="M 170 330 A 150 150 0 0 0 410 240 L 170 330 Z" fill="#15803d"/>
    <path d="M 178 322 A 140 140 0 0 0 402 248 L 178 322 Z" fill="#bbf7d0"/>
    <!-- Red Pulp -->
    <path d="M 188 312 A 128 128 0 0 0 392 258 L 188 312 Z" fill="#ef4444"/>
    <!-- Seeds -->
    <ellipse cx="240" cy="305" rx="5" ry="9" transform="rotate(-30 240 305)" fill="#18181b"/>
    <ellipse cx="295" cy="295" rx="5" ry="9" transform="rotate(-15 295 295)" fill="#18181b"/>
    <ellipse cx="345" cy="280" rx="5" ry="9" transform="rotate(0 345 280)" fill="#18181b"/>
  </g>

  <!-- Juicy Splash Droplets -->
  <circle cx="160" cy="140" r="14" fill="#f43f5e"/>
  <circle cx="130" cy="180" r="8" fill="#ef4444"/>
  <circle cx="390" cy="360" r="16" fill="#f43f5e"/>
  <circle cx="430" cy="320" r="10" fill="#f97316"/>
  <circle cx="210" cy="380" r="12" fill="#ef4444"/>
  <circle cx="330" cy="130" r="12" fill="#fbbf24"/>

  <!-- Slicing Blade Trail Laser Slash -->
  <path d="M 60 450 Q 256 256 460 70" stroke="url(#glow)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M 60 450 Q 256 256 460 70" stroke="url(#blade)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Star Sparkles -->
  <polygon points="460,70 470,85 490,90 475,105 480,125 460,115 440,125 445,105 430,90 450,85" fill="#fef08a"/>
</svg>
